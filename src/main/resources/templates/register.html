<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – MediAI Healthcare Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1 d-flex align-items-center py-5">
  <div class="container" style="max-width: 520px;">
    <!-- Title -->
    <div class="text-center mb-4">
      <div class="rounded-3 d-inline-flex align-items-center justify-content-center text-white mb-2" 
           style="width: 3rem; height: 3rem; background: linear-gradient(135deg, #2563EB, #14B8A6);">
        <i class="bi bi-heart-pulse-fill fs-4 animate-heart"></i>
      </div>
      <h3 class="fw-extrabold text-dark mb-1">Create MediAI Account</h3>
      <p class="text-muted small">Join for personalized AI preliminary triage and health telemetry</p>
    </div>

    <!-- Register Card -->
    <div class="mediai-card p-4 p-sm-5 bg-white">
      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <!-- Role Selection: Patient or Doctor only (Admin strictly blocked) -->
        <div class="mb-3">
          <label class="form-label small fw-semibold">Account Type</label>
          <div class="row g-2">
            <div class="col-6">
              <input type="radio" class="btn-check" name="role" id="rolePatient" value="ROLE_PATIENT" th:field="*{role}" checked>
              <label class="btn btn-outline-primary w-100 py-2 small fw-semibold" for="rolePatient">
                <i class="bi bi-person me-1"></i> Patient
              </label>
            </div>
            <div class="col-6">
              <input type="radio" class="btn-check" name="role" id="roleDoctor" value="ROLE_DOCTOR" th:field="*{role}">
              <label class="btn btn-outline-info w-100 py-2 small fw-semibold" for="roleDoctor">
                <i class="bi bi-stethoscope me-1"></i> Doctor
              </label>
            </div>
          </div>
          <small class="text-muted d-block mt-1" style="font-size: 0.7rem;">
            *Hospital Administrator accounts are created via secure clinical provisioning only.
          </small>
        </div>

        <!-- Full Name -->
        <div class="mb-3">
          <label class="form-label small fw-semibold">Full Legal Name <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
            <input type="text" th:field="*{fullName}" required class="form-control" placeholder="e.g. Alexander Hayes">
          </div>
          <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" th:field="*{email}" required class="form-control" placeholder="alexander@example.com">
          </div>
          <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <!-- Phone -->
        <div class="mb-3">
          <label class="form-label small fw-semibold">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-telephone text-muted"></i></span>
            <input type="tel" th:field="*{phone}" class="form-control" placeholder="+1 (555) 234-5678">
          </div>
        </div>

        <!-- Password -->
        <div class="row g-2 mb-4">
          <div class="col-sm-6">
            <label class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" th:field="*{password}" required class="form-control" placeholder="Min 6 chars">
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
              <input type="password" th:field="*{confirmPassword}" required class="form-control" placeholder="Re-enter">
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-medical w-100 py-2.5 mb-3">
          <i class="bi bi-check-circle me-1"></i> Complete Registration
        </button>
      </form>

      <div class="text-center mt-3 text-muted small">
        Already registered? <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">Sign In</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
