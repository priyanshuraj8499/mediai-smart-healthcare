<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – MediAI Healthcare Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1 d-flex align-items-center py-5">
  <div class="container" style="max-width: 480px;">
    <!-- Logo & Title -->
    <div class="text-center mb-4">
      <div class="rounded-3 d-inline-flex align-items-center justify-content-center text-white mb-2" 
           style="width: 3rem; height: 3rem; background: linear-gradient(135deg, #2563EB, #14B8A6);">
        <i class="bi bi-heart-pulse-fill fs-4 animate-heart"></i>
      </div>
      <h3 class="fw-extrabold text-dark mb-1">Sign In to MediAI</h3>
      <p class="text-muted small">Access your patient portal, physician records, or admin dashboard</p>
    </div>

    <!-- Login Card -->
    <div class="mediai-card p-4 p-sm-5 bg-white">
      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <form th:action="@{/login}" method="post">
        <!-- CSRF token automatically supplied by Thymeleaf -->

        <!-- Email input -->
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" name="email" id="emailInput" required class="form-control" placeholder="name@mediai.health" autofocus>
          </div>
        </div>

        <!-- Password input -->
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold mb-0">Password</label>
            <span class="text-muted small" style="font-size: 0.75rem;">Default demo: password123</span>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" name="password" id="passwordInput" required class="form-control" placeholder="••••••••">
            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-medical w-100 py-2.5 mb-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
        </button>
      </form>

      <!-- 1-Click Fast Evaluation Buttons -->
      <div class="pt-3 border-top text-center">
        <div class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.7rem; letter-spacing: 0.05em;">
          1-Click Evaluator Quick Logins:
        </div>
        <div class="row g-2">
          <div class="col-4">
            <button type="button" class="btn btn-outline-medical btn-sm w-100 py-2 text-start"
                    onclick="document.getElementById('emailInput').value='admin@mediai.health'; document.getElementById('passwordInput').value='password123';">
              <div class="fw-bold text-dark text-truncate" style="font-size: 0.75rem;">Admin</div>
              <small class="text-muted text-truncate d-block" style="font-size: 0.65rem;">Dr. Jenkins</small>
            </button>
          </div>
          <div class="col-4">
            <button type="button" class="btn btn-outline-medical btn-sm w-100 py-2 text-start"
                    onclick="document.getElementById('emailInput').value='dr.marcus@mediai.health'; document.getElementById('passwordInput').value='password123';">
              <div class="fw-bold text-dark text-truncate" style="font-size: 0.75rem;">Doctor</div>
              <small class="text-muted text-truncate d-block" style="font-size: 0.65rem;">Dr. Vance</small>
            </button>
          </div>
          <div class="col-4">
            <button type="button" class="btn btn-outline-medical btn-sm w-100 py-2 text-start"
                    onclick="document.getElementById('emailInput').value='patient@mediai.health'; document.getElementById('passwordInput').value='password123';">
              <div class="fw-bold text-dark text-truncate" style="font-size: 0.75rem;">Patient</div>
              <small class="text-muted text-truncate d-block" style="font-size: 0.65rem;">Alexander</small>
            </button>
          </div>
        </div>
      </div>

      <div class="text-center mt-4 text-muted small">
        Don't have an account? <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Register Patient Account</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
