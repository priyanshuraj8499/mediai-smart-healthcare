# ===================================================================
# MediAI – Spring Boot 3 & MySQL 8.0 Healthcare Application Configuration
# ===================================================================

server.port=${PORT:8081}
spring.application.name=mediai-healthcare

# -------------------------------------------------------------------
# Datasource Configuration (MySQL 8.0 with Env Variable Override)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mediai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# -------------------------------------------------------------------
# Static Resources Handling
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# AI API Integration Configuration (Configurable RestClient / WebClient)
# -------------------------------------------------------------------
mediai.ai.api.key=${GEMINI_API_KEY:${AI_API_KEY:}}
mediai.ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
mediai.ai.model=gemini-1.5-flash

# Logging
logging.level.com.mediai=INFO
logging.level.org.springframework.security=INFO

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
